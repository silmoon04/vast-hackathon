<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Local video caption search</title>
<style>body{font:16px system-ui;max-width:850px;margin:3rem auto;padding:0 1rem;color:#18252c}input{width:70%;padding:.7rem}button{padding:.7rem}article{border-top:1px solid #ccd4d8;padding:1rem 0}.hint{color:#52646d}</style>
<h1>Local video caption search</h1><p class="hint">Searches reviewed captions. Optional remote reasoning receives retrieved evidence only.</p>
<form id="f"><input id="q" maxlength="500" placeholder="What appears in the video?" required><button>Search</button></form><p id="mode" class="hint"></p><main id="out"></main>
<script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();let out=document.getElementById('out'),mode=document.getElementById('mode'),q=document.getElementById('q');out.textContent='Searching…';try{let r=await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q.value})}),d=await r.json();mode.textContent=d.retrieval_mode||'';out.replaceChildren();if(d.answer){let answer=document.createElement('article');answer.textContent=d.answer;out.append(answer)}if(d.result?.error){let p=document.createElement('p');p.textContent=d.result.error;out.append(p)}for(const x of d.evidence||[]){let a=document.createElement('article'),h=document.createElement('b'),p=document.createElement('p');h.textContent=`${x.camera} · ${x.source_start}–${x.source_end}s · ${x.id}`;p.textContent=x.caption;a.append(h,p);if(x.video_available){let v=document.createElement('video');v.controls=true;v.preload='metadata';v.src='/video/'+encodeURIComponent(x.id);v.addEventListener('loadedmetadata',()=>{v.currentTime=Math.max(0,Number(x.clip_start)||0)},{once:true});a.append(v)}out.append(a)}}catch(_){out.textContent='Search failed'}}</script>
