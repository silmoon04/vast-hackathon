<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hide &amp; Seek: can the index find your clip?</title>
<style>
:root{--bg:#0e1116;--panel:#171c24;--line:#2a323d;--fg:#eef1f5;--mut:#93a0b0;--acc:#ffb020;--yes:#2fbf71;--no:#e5484d;--sky:#4aa3ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 "Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:baseline;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:24px;margin:0;letter-spacing:.5px}h1 b{color:var(--acc)}
header .sub{color:var(--mut);flex:1;min-width:200px}
.tabs{display:flex;gap:6px}.tabs button{background:var(--panel);color:var(--mut);border:1px solid var(--line);padding:7px 14px;border-radius:8px;cursor:pointer;font:inherit}
.tabs button.on{color:var(--bg);background:var(--acc);border-color:var(--acc);font-weight:700}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;padding:16px 20px;max-width:1500px;margin:0 auto}
@media(max-width:1000px){main{grid-template-columns:1fr}}
.count{display:flex;align-items:baseline;gap:12px;margin:0 0 10px}.count b{font-size:42px;color:var(--acc);line-height:1}.count span{color:var(--mut)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--acc);transition:width .5s}
.grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
@media(max-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;aspect-ratio:16/9;border-radius:5px;overflow:hidden;background:#000;border:2px solid transparent;transition:opacity .5s,filter .5s,transform .5s,border-color .3s;cursor:default}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .id{position:absolute;left:3px;top:2px;font-size:10px;background:#000a;padding:0 4px;border-radius:3px;color:#fff}
.tile.out{opacity:.1;filter:grayscale(1);transform:scale(.9)}
.tile.maybe{opacity:.5;filter:saturate(.5)}
.tile.win{border-color:var(--acc);box-shadow:0 0 0 3px #ffb02055;z-index:2;transform:scale(1.08)}
.tile.secret::after{content:"secret";position:absolute;right:3px;bottom:2px;font-size:10px;background:var(--acc);color:#000;padding:0 5px;border-radius:3px;font-weight:700}
.tile.pick{cursor:pointer}.tile.pick:hover{border-color:var(--sky)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;position:sticky;top:12px;align-self:start}
.qn{color:var(--mut);font-size:13px;letter-spacing:.8px;text-transform:uppercase}
.q{font-size:25px;font-weight:700;margin:6px 0 14px;line-height:1.2;min-height:62px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btns button{font:inherit;font-size:20px;font-weight:700;border:0;border-radius:10px;padding:14px;cursor:pointer;color:#fff}
.btns .y{background:var(--yes)}.btns .n{background:var(--no)}.btns .u{grid-column:1/3;background:#2a323d;font-size:15px;font-weight:600;padding:10px}
.row{display:flex;gap:8px;margin-top:10px}.row button,.mini{font:inherit;background:transparent;color:var(--mut);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.row button:hover,.mini:hover{color:var(--fg);border-color:var(--mut)}
.hist{margin-top:14px;max-height:260px;overflow:auto;font-size:13px}
.hist div{display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--line)}.hist .a{font-weight:700;width:36px}.hist .a.y{color:var(--yes)}.hist .a.n{color:var(--no)}.hist .a.u{color:var(--mut)}.hist .r{margin-left:auto;color:var(--acc);white-space:nowrap}
.found h2{margin:2px 0 8px;font-size:22px;color:var(--acc)}.found video,.found img{width:100%;border-radius:8px;display:block;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}.chip{background:#232b36;border:1px solid var(--line);border-radius:12px;padding:1px 9px;font-size:12px;color:#cdd6e0}
.twin{border:1px dashed var(--no);border-radius:8px;padding:8px;margin-top:8px}.twin h3{margin:0 0 6px;font-size:15px;color:var(--no)}
.tw{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.tw img{width:100%;border-radius:4px}
.lk{display:none;padding:16px 20px;max-width:1500px;margin:0 auto}.lk.on{display:block}
.lk .grp{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}.lk .grp h3{margin:0 0 6px;font-size:15px}
.lk .imgs{display:flex;gap:8px;flex-wrap:wrap}.lk figure{margin:0;width:220px}.lk figure img{width:100%;border-radius:6px;display:block}.lk figcaption{font-size:12px;color:var(--mut)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:8px 0 14px}.stat div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.stat b{display:block;font-size:26px;color:var(--acc)}.stat span{color:var(--mut);font-size:12px}
.hidden{display:none}
#tip{position:fixed;z-index:20;display:none;max-width:330px;background:#0b0e13f2;border:1px solid var(--line);border-radius:10px;padding:10px 12px;pointer-events:none;font-size:13px;box-shadow:0 8px 30px #000a}
#tip .cap,.found .cap{color:var(--mut);font-size:12px;margin-top:4px}
.pickrow figure{margin:0;cursor:pointer}.pickrow figure img{border:2px solid transparent}.pickrow figure:hover img{border-color:var(--acc)}.pickrow figcaption{font-size:12px;color:var(--mut);text-align:center}
.pickrow{grid-template-columns:repeat(2,1fr)}.note.soft{color:var(--acc)}
.note{color:var(--mut);font-size:12px;margin-top:12px}
</style></head><body>
<header><h1>HIDE <b>&amp;</b> SEEK</h1>
<div class="sub">Think of one of these __N__ clips. Answer yes / no. The index has to find it. Where it can't, it shows you.</div>
<div class="tabs"><button id="t-play" class="on">You think of a clip</button><button id="t-auto">Auto-play</button><button id="t-look">Lookalike report</button></div></header>

<div id="tip"></div>
<main id="game">
<section>
 <div class="count"><b id="left">__N__</b><span id="leftTxt">clips left</span></div>
 <div class="bar"><i id="barfill" style="width:100%"></i></div>
 <div class="grid" id="grid"></div>
 <div class="note" id="stage-note"></div>
</section>
<aside class="panel" id="panel"></aside>
</main>

<section class="lk" id="lookalikes"></section>

<script>
const DATA = __DATA__;
__ENGINE__
const E = makeEngine(DATA), C = E.C, Q = E.Q, N = E.N, H = E.H, best = E.best, EPS = E.PARAMS.eps;
// ---- state: log of events {t:'q',qi,a} | {t:'g',ids,ok} | {t:'found',id} ----
let mode = 'play', log = [], secret = -1, auto = null;
const $ = id => document.getElementById(id);
const grid = $('grid'), tip = $('tip');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
C.forEach((c, i) => {
  const d = document.createElement('div'); d.className = 'tile'; d.id = 'tile' + i;
  d.innerHTML = '<img src="' + c.thumb + '" alt=""><span class="id">' + c.id + '</span>';
  d.onclick = () => { if (mode === 'auto' && !auto) { secret = i; startAuto(); } };
  d.onmouseenter = d.onmousemove = ev => {
    tip.innerHTML = '<b>' + c.id + ' &middot; ' + esc(c.label) + '</b><div class="chips">' + c.chips.map(x => '<span class="chip">' + esc(x) + '</span>').join('') + '</div><div class="cap">' + esc(c.caption || 'no caption') + '</div><div class="cap">This is what the index stores. Answer the questions the way it would.</div>';
    tip.style.display = 'block';
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, ev.clientX + 14)) + 'px';
    tip.style.top = Math.max(8, Math.min(innerHeight - h - 8, ev.clientY + 14)) + 'px';
  };
  d.onmouseleave = () => { tip.style.display = 'none'; };
  grid.appendChild(d);
});
const hist = () => log.filter(e => e.t === 'q').map(e => ({qi: e.qi, a: e.a}));
const wrong = () => log.filter(e => e.t === 'g' && !e.ok).map(e => e.ids);
const foundEv = () => log.find(e => e.t === 'found');
function chipsHTML(c) { return '<div class="chips">' + c.chips.map(x => '<span class="chip">' + esc(x) + '</span>').join('') + '</div>'; }
function clipMedia(c) {
  return c.video ? '<video poster="' + c.thumb + '" src="' + c.video + '" autoplay muted loop playsinline controls onerror="this.outerHTML=\'<img src=&quot;' + c.thumb + '&quot;>\'"></video>' : '<img src="' + c.thumb + '">';
}
function render() {
  const h = hist(), wr = wrong(), fe = foundEv();
  const rej = new Set(); wr.forEach(g => g.forEach(i => rej.add(i)));
  const hard = E.hardCand(h);
  const soft = rej.size > 0 || hard.length === 0;
  const w = soft ? E.weights(h, rej, EPS) : null;
  const wmax = w ? Math.max(...w) : 1;
  let nLeft = 0;
  C.forEach((c, i) => {
    const t = $('tile' + i);
    let cls = '';
    if (fe) cls = fe.id === i ? 'win' : 'out';
    else if (!soft) cls = hard.includes(i) ? (hard.length === 1 ? 'win' : '') : 'out';
    else cls = w[i] >= wmax - 1e-12 ? '' : (w[i] > 0 && w[i] >= wmax * EPS - 1e-12 ? 'maybe' : 'out');
    if (cls !== 'out') nLeft++;
    t.classList.toggle('out', cls === 'out'); t.classList.toggle('maybe', cls === 'maybe'); t.classList.toggle('win', cls === 'win');
    t.classList.toggle('secret', i === secret && mode === 'auto');
    t.classList.toggle('pick', mode === 'auto' && !auto);
  });
  const nq = h.filter(x => x.a !== null).length;
  $('left').textContent = nLeft; $('leftTxt').textContent = fe ? 'clip: found' : (soft ? 'clips still possible (shaded = one answer disagrees)' : 'clips left');
  $('barfill').style.width = (100 * Math.log2(Math.max(nLeft, 1)) / Math.log2(N)) + '%';
  const P = $('panel');
  const histHTML = log.map(e => {
    if (e.t === 'q') return '<div><span class="a ' + (e.a === null ? 'u' : e.a ? 'y' : 'n') + '">' + (e.a === null ? '?' : e.a ? 'YES' : 'NO') + '</span><span>' + Q[e.qi].text + '</span><span class="r">' + e.after + '</span></div>';
    if (e.t === 'g') return '<div><span class="a ' + (e.ok ? 'y' : 'n') + '">' + (e.ok ? 'YES' : 'NO') + '</span><span>Guess: ' + e.ids.map(i => C[i].id).join(' / ') + '</span></div>';
    return '';
  }).join('');
  const undoBtn = '<button onclick="undo()"' + (log.length ? '' : ' disabled') + '>Undo</button><button onclick="reset()">Restart</button>';
  if (fe) {
    const c = C[fe.id], nG = log.filter(e => e.t === 'g').length;
    const viaTwin = log.some(e => e.t === 'g' && e.ok && e.ids.length > 1);
    P.innerHTML = '<div class="found"><div class="qn">found in ' + nq + ' question' + (nq === 1 ? '' : 's') + ' + ' + nG + ' guess' + (nG === 1 ? '' : 'es') + '</div><h2>' + c.id + ' &middot; ' + esc(c.label) + '</h2>' + clipMedia(c) + chipsHTML(c) + '<div class="cap">Cosmos caption: ' + esc(c.caption || 'n/a') + '</div>' + (viaTwin ? '<div class="twin"><h3>The index could not tell this one from its lookalike; you picked.</h3></div>' : '') + (nG > 1 ? '<div class="note">An earlier guess was wrong: the index and the answers disagreed somewhere, and the soft search recovered.</div>' : '') + '</div><div class="row">' + undoBtn.replace('>Restart<', '>Play again<') + '</div><div class="hist">' + histHTML + '</div>';
    return;
  }
  const st = E.nextStep(h, wr);
  if (st.type === 'giveup') {
    P.innerHTML = '<div class="qn">the index gives up</div><div class="q">I could not find it. ' + (wr.length >= E.PARAMS.max_guesses ? 'Three guesses were wrong.' : 'Nothing matches.') + '</div><div class="note">Probably an answer disagreed with how the index sees the clip (hover a tile to see what it stores).</div><div class="row">' + undoBtn + '</div><div class="hist">' + histHTML + '</div>';
    return;
  }
  if (st.type === 'guess') {
    const ids = st.ids;
    if (mode === 'auto') {
      P.innerHTML = '<div class="qn">' + (wr.length ? 'new guess after a miss' : 'after ' + nq + ' question' + (nq === 1 ? '' : 's')) + ' &middot; auto-play</div><div class="q">Is it ' + (ids.length === 1 ? 'this one' : 'one of these') + '? ' + ids.map(i => C[i].id).join(' / ') + '</div><div class="hist">' + histHTML + '</div>';
    } else if (ids.length === 1) {
      const c = C[ids[0]];
      P.innerHTML = '<div class="qn">' + (wr.length ? 'new guess after a miss' : 'after ' + nq + ' question' + (nq === 1 ? '' : 's')) + '</div><div class="q">Is it this one?</div>' + clipMedia(c) + chipsHTML(c) + '<div class="btns"><button class="y" onclick="guess(true)">YES, found it</button><button class="n" onclick="guess(false)">NO</button></div><div class="row">' + undoBtn + '</div><div class="hist">' + histHTML + '</div>';
    } else {
      P.innerHTML = '<div class="qn">lookalikes: identical in the index</div><div class="q">Which of these is yours?</div><div class="note">The index cannot separate them. Pick one.</div><div class="tw pickrow">' + ids.map(i => '<figure onclick="pickTwin(' + i + ')"><img src="' + C[i].thumb + '"><figcaption>' + C[i].id + '</figcaption></figure>').join('') + '</div><div class="btns"><button class="u" onclick="guess(false)">None of these</button></div><div class="row">' + undoBtn + '</div><div class="hist">' + histHTML + '</div>';
    }
    return;
  }
  const qi = st.qi;
  const base = soft ? '<div class="note soft">One answer seems to disagree with the index. Keep going: single wrong answers are now forgiven.</div>' : '';
  const bits = soft ? '' : ' &middot; best split: ' + H(hard.filter(i => Q[qi].ans[i]).length, hard.length).toFixed(2) + ' bits';
  if (mode === 'auto') {
    P.innerHTML = '<div class="qn">question ' + (nq + 1) + ' &middot; auto-play</div><div class="q">' + Q[qi].text + '</div><div class="note">The secret clip answers for itself.</div><div class="hist">' + histHTML + '</div>';
  } else {
    P.innerHTML = '<div class="qn">question ' + (nq + 1) + bits + '</div><div class="q">' + Q[qi].text + '</div><div class="btns"><button class="y" onclick="ans(true)">YES</button><button class="n" onclick="ans(false)">NO</button><button class="u" onclick="ans(null)">Not sure / skip</button></div>' + base + '<div class="row">' + undoBtn + '</div><div class="hist">' + histHTML + '</div>';
  }
}
function countAfter(qi, a) {
  const hard = E.hardCand(hist());
  return a === null ? hard.length : hard.filter(i => Q[qi].ans[i] === a).length;
}
function ans(a) {
  const st = E.nextStep(hist(), wrong()); if (st.type !== 'ask') return;
  log.push({t: 'q', qi: st.qi, a, after: countAfter(st.qi, a)}); render();
}
function guess(ok) {
  const st = E.nextStep(hist(), wrong()); if (st.type !== 'guess') return;
  log.push({t: 'g', ids: st.ids, ok});
  if (ok) log.push({t: 'found', id: st.ids[0]});
  render();
}
function pickTwin(i) {
  const st = E.nextStep(hist(), wrong()); if (st.type !== 'guess') return;
  log.push({t: 'g', ids: st.ids, ok: true}); log.push({t: 'found', id: i}); render();
}
function undo() { if (foundEv()) log.pop(); log.pop(); auto = null; render(); }
function reset() { log = []; secret = -1; auto = null; render(); if (mode === 'auto') $('stage-note').textContent = 'Click any tile to make it the secret, or press Random.'; }
function setMode(m) {
  mode = m; reset();
  for (const [id, mm] of [['t-play', 'play'], ['t-auto', 'auto'], ['t-look', 'look']]) $(id).classList.toggle('on', mm === m);
  $('game').classList.toggle('hidden', m === 'look'); $('lookalikes').classList.toggle('on', m === 'look');
  $('stage-note').textContent = m === 'auto' ? 'Click any tile to make it the secret, or press Random.' : 'Look through the grid, silently pick one clip, then answer honestly. "Not sure" skips a question. Hover a tile to see what the index stores about it.';
  if (m === 'auto') $('panel').innerHTML = '<div class="qn">auto-play</div><div class="q">Pick a secret clip.</div><div class="btns"><button class="y" style="grid-column:1/3" onclick="secret=Math.floor(Math.random()*N);startAuto()">Random secret</button></div>';
}
function startAuto() {
  log = []; auto = true; render();
  const step = () => {
    if (!auto) return;
    const st = E.nextStep(hist(), wrong());
    if (st.type === 'ask') {
      const a = !!Q[st.qi].ans[secret];
      const qe = $('panel').querySelector('.q');
      if (qe) qe.innerHTML = Q[st.qi].text + ' <span style="color:' + (a ? 'var(--yes)' : 'var(--no)') + '">' + (a ? 'YES' : 'NO') + '</span>';
      setTimeout(() => { if (!auto) return; log.push({t: 'q', qi: st.qi, a, after: countAfter(st.qi, a)}); render(); setTimeout(step, 700); }, 900);
    } else if (st.type === 'guess') {
      const ok = st.ids.includes(secret);
      setTimeout(() => { if (!auto) return; log.push({t: 'g', ids: st.ids, ok}); if (ok) { log.push({t: 'found', id: secret}); auto = null; } render(); if (auto) setTimeout(step, 700); }, 1100);
    } else { auto = null; render(); }
  };
  step();
}
$('t-play').onclick = () => setMode('play'); $('t-auto').onclick = () => setMode('auto'); $('t-look').onclick = () => setMode('look');
// ---- lookalike report ----
(function () {
  const S = DATA.stats; const L = $('lookalikes');
  let h = '<div class="stat"><div><b>' + (100 * S.success_rate).toFixed(0) + '%</b><span>clips isolated uniquely by questions alone (every clip played as the secret)</span></div><div><b>' + S.mean_questions_all.toFixed(2) + '</b><span>mean questions (max ' + S.max_questions + ')</span></div><div><b>' + S.clips_in_twin_groups + '</b><span>clips with an attribute twin (' + S.twin_groups + ' groups)</span></div><div><b>' + S.blind + '</b><span>clips the detectors see nothing in</span></div><div><b>' + (100 * S.protocol_found).toFixed(0) + '%</b><span>found by the page protocol incl. "Is it this one?" guesses (mean ' + S.protocol_mean_total.toFixed(1) + ' questions + guesses)</span></div></div>';
  h += '<h2>Lookalikes: the index cannot tell these apart</h2>';
  DATA.twins.forEach((g, k) => { h += '<div class="grp"><h3>Group ' + (k + 1) + ': ' + g.length + ' clips, identical attribute vector</h3><div class="chips">' + g[0].chips.map(x => '<span class="chip">' + x + '</span>').join('') + '</div><div class="imgs">' + g.map(m => '<figure><img src="' + m.thumb + '"><figcaption>' + m.id + ' &middot; ' + m.label + '</figcaption></figure>').join('') + '</div></div>'; });
  if (!DATA.twins.length) h += '<p>None.</p>';
  h += '<h2>Invisible to search: detectors found nothing</h2><div class="imgs">' + DATA.blind.map(m => '<figure><img src="' + m.thumb + '"><figcaption>' + m.id + ' &middot; ' + m.label + ' &middot; ' + m.why + '</figcaption></figure>').join('') + '</div>';
  L.innerHTML = h;
})();
setMode('play');
// deep links: #look = lookalike report, #auto=c22 = auto-play with that secret, #play=3 = pre-answer 3 questions truthfully for a demo
(function () {
  const h = location.hash.slice(1);
  if (h === 'look') setMode('look');
  else if (h.startsWith('auto=')) { const i = C.findIndex(c => c.id === h.slice(5)); if (i >= 0) { setMode('auto'); secret = i; startAuto(); } }
})();
</script></body></html>
