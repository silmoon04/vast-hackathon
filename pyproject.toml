[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vastkit"
version = "0.1.0"
description = "Python toolkit for the VAST video stack: clients, mocks, local model servers and evaluation helpers"
requires-python = ">=3.10"
# Core = config, http, vss and gpu clients. Extras are compatible ranges; requirements.txt holds
# the exact pins this repo is tested with. GPU/embed model servers need the CUDA wheel index, so
# they stay in requirements-gpu.txt / requirements-embed.txt (not extras).
dependencies = ["httpx[socks]>=0.26,<1"]

[project.optional-dependencies]
mock = ["fastapi>=0.100", "uvicorn>=0.23", "pydantic>=2,<3", "python-multipart>=0.0.9"]
llm = ["openai>=1.0", "weave>=0.52"]
vdb = ["vastdb>=1.3,<3", "adbc-driver-manager>=1.0", "duckdb>=1.0", "pyarrow>=18", "numpy>=1.26", "boto3>=1.28"]
media = ["av>=12", "opencv-python>=4.8", "numpy>=1.26"]
dev = ["pytest>=8"]
all = ["vastkit[mock,llm,vdb,media,dev]"]

[project.scripts]
vastkit = "vastkit.__main__:main"

[tool.setuptools]
packages = ["vastkit", "vastkit.gpu", "vastkit.mocks", "vastkit.local"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
