<style>
/* Layout: an evidence desk for one street camera. Stage on the left (what the camera saw), inspector on the right (what it means), a ledger strip of every second underneath. Night-street palette: deep road-blue with a sodium-lamp amber accent; presence states use their own semantic colours. */
:root{
  --night:#0F1724; --panel:#162131; --raised:#1D2A3D; --line:#2A3A52; --ink:#E6ECF4; --dim:#93A3B8;
  --sodium:#F2A93B; --sodium-ink:#1B1406; --present:#3CC488; --gone:#F0645A; --blind:#6B778A; --moved:#E9C84A; --swap:#B48CF2;
  --display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--night);color:var(--ink)}
body{margin:0;font:15px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sodium);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--display);font-weight:600;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--night);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:1.45rem;font-weight:700;letter-spacing:.02em}
.brand h1 b{color:var(--sodium)}
.rec{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.78rem;color:var(--dim)}
.rec::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gone);box-shadow:0 0 0 3px rgba(240,100,90,.18)}
.cams select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:5px 8px;font-family:var(--mono);font-size:.82rem;max-width:100%}
.cam{border:1px solid var(--line);background:transparent;border-radius:4px;padding:4px 10px;cursor:pointer;font-family:var(--mono);font-size:.8rem;color:var(--dim)}
.cam[aria-pressed="true"]{border-color:var(--sodium);color:var(--sodium)}
nav.modes{display:flex;gap:2px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:auto;max-width:100%}
nav.modes::-webkit-scrollbar{display:none}
@media (max-width:900px){header.bar{position:static}.rec{display:none}nav.modes{margin-left:0;width:100%}.thesis{padding-block:12px 8px}.thesis p{font-size:.9rem}}
.mode{white-space:nowrap;flex:0 0 auto;background:transparent;border:0;border-bottom:2px solid transparent;padding:6px 10px;cursor:pointer;font-family:var(--display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.88rem;color:var(--dim)}
.mode[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sodium)}
.thesis{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 20px;padding-block:18px 12px}
.thesis h2{font-size:clamp(1.3rem,3.2vw,1.9rem);font-weight:600;max-width:34ch}
.thesis p{margin:0;color:var(--dim);max-width:60ch}
.sim{display:inline-block;font-family:var(--mono);font-size:.72rem;color:var(--sodium);border:1px dashed var(--sodium);padding:1px 6px;border-radius:3px}
.desk{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:900px){.desk{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:0}
.screen{position:relative;background:#000;line-height:0}
.screen video,.screen img.plate{width:100%;height:auto;display:block}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.osd{position:absolute;left:10px;top:10px;font-family:var(--mono);font-size:.76rem;line-height:1.4;background:rgba(10,15,24,.72);color:var(--ink);padding:4px 8px;border-radius:3px;pointer-events:none}
.osd.r{left:auto;right:10px}
#tip{white-space:nowrap;z-index:2}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 12px;border-top:1px solid var(--line)}
.btn{background:var(--raised);border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--sodium);color:var(--sodium-ink);border-color:var(--sodium);font-weight:600}
.chip{background:transparent;border:1px solid var(--line);border-radius:99px;padding:3px 10px;cursor:pointer;font-size:.82rem;color:var(--dim)}
.chip[aria-pressed="true"]{background:var(--raised);color:var(--ink);border-color:var(--dim)}
.inspector{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.inspector h3{font-size:1.15rem;font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.88rem}
.kv dt{color:var(--dim)}.kv dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums}
.crop{width:100%;max-height:220px;object-fit:contain;background:#000;border-radius:4px;border:1px solid var(--line)}
.empty{color:var(--dim);font-size:.9rem}
.pill{display:inline-block;font-family:var(--display);font-weight:600;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:3px}
.pill.present,.pill.same,.pill.consistent,.pill.yes{background:rgba(60,196,136,.16);color:var(--present)}
.pill.gone,.pill.left,.pill.contradiction,.pill.no{background:rgba(240,100,90,.16);color:var(--gone)}
.pill.unknown,.pill.blind,.pill.unverifiable{background:rgba(107,119,138,.22);color:#B5C0CE}
.pill.arrived{background:rgba(60,196,136,.16);color:var(--present)}
.pill.moved{background:rgba(233,200,74,.16);color:var(--moved)}
.pill.swapped{background:rgba(180,140,242,.16);color:var(--swap)}
.strip{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.strip svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--dim)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px}
.stat b{display:block;font-family:var(--display);font-size:1.6rem;font-weight:600;line-height:1}
.stat span{font-size:.78rem;color:var(--dim)}
.list{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow:auto}
.item{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center;background:var(--raised);border:1px solid transparent;border-radius:5px;padding:6px;cursor:pointer;text-align:left;width:100%}
.item[aria-current="true"]{border-color:var(--sodium)}
.item img{width:64px;height:48px;object-fit:cover;border-radius:3px;background:#000}
.item .t{font-size:.86rem}.item .s{font-size:.76rem;color:var(--dim)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair figure{margin:0;display:flex;flex-direction:column;gap:4px}
.pair figcaption{font-size:.74rem;color:var(--dim);font-family:var(--mono)}
.reveal{position:relative;line-height:0;background:#000}
.reveal img{width:100%;display:block}
.reveal .top{position:absolute;inset:0;overflow:hidden;clip-path:inset(0 0 0 50%)}
.reveal .top img{width:100%}
.reveal .handle{position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--sodium);pointer-events:none}
.reveal .tag{position:absolute;top:10px;font-family:var(--mono);font-size:.76rem;background:rgba(10,15,24,.75);padding:3px 8px;border-radius:3px;line-height:1.4}
.ask{display:flex;gap:8px;flex-wrap:wrap;padding:12px;border-top:1px solid var(--line)}
.ask input{flex:1 1 260px;min-width:0;background:var(--night);border:1px solid var(--line);border-radius:4px;padding:10px 12px;color:var(--ink);font:inherit}
.answer{display:flex;flex-direction:column;gap:8px;padding:14px;border-top:1px solid var(--line)}
.answer .verdict{font-family:var(--display);font-size:2.4rem;font-weight:700;line-height:1}
.answer .verdict.yes{color:var(--present)}.answer .verdict.no{color:var(--gone)}.answer .verdict.unknown{color:#B5C0CE}
.answer .verdict.other{color:var(--sodium)}
.honesty{border-left:3px solid var(--blind);padding:4px 10px;color:#C4CDD9;font-size:.88rem}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}.thumbs img{height:84px;border-radius:3px;border:1px solid var(--line);background:#000}
.rows{display:flex;flex-direction:column;gap:10px;padding:12px}
.row{display:grid;grid-template-columns:160px minmax(0,1fr);gap:12px;background:var(--raised);border-radius:5px;padding:10px}
@media (max-width:560px){.row{grid-template-columns:minmax(0,1fr)}.pair{grid-template-columns:1fr}}
.row img{width:100%;border-radius:3px;background:#000}
.row p{margin:0}
mark{background:rgba(242,169,59,.22);color:var(--ink);padding:0 2px;border-radius:2px}
mark.bad{background:rgba(240,100,90,.25)}
.counts{font-family:var(--mono);font-size:.78rem;color:var(--dim)}
footer{color:var(--dim);font-size:.78rem;padding-block:20px 0;display:flex;flex-direction:column;gap:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style data-owner="ui-shell">
/* ui-shell: header badge, brief card, presenter mode. Selectors prefixed .shell-/#brief/html.stm-demo. */
.shell-defs{position:absolute;width:0;height:0;overflow:hidden}
header.bar .brand{flex-wrap:wrap;row-gap:4px}
.shell-camtag{font-family:var(--mono);font-size:.78rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:36ch}
.shell-badge{font-family:var(--mono);font-size:.72rem;letter-spacing:.03em;padding:1px 7px;border-radius:3px;white-space:nowrap;border:1px solid var(--line);color:var(--dim)}
.shell-badge.sim{color:var(--sodium);border:1px dashed var(--sodium)}
.shell-badge.real{color:var(--present);border-color:rgba(60,196,136,.55)}
#brief.shell-brief{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--sodium);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
#brief[hidden]{display:none}
#brief .shell-brief-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
#brief .shell-brief-tog{flex:0 0 auto;background:transparent;border:1px solid var(--line);border-radius:4px;padding:2px 10px;cursor:pointer;font-size:.78rem;color:var(--dim)}
#brief .shell-brief-h{margin:0;font-family:var(--display);font-weight:600;font-size:1.6rem;line-height:1.15;text-wrap:balance;max-width:56ch}
#brief.shell-collapsed .shell-brief-h{font-size:1.2rem}
#brief.shell-collapsed .shell-brief-list,#brief.shell-collapsed .shell-brief-hon{display:none}
#brief .shell-brief-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
#brief .shell-bul{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center;width:100%;height:100%;text-align:left;background:var(--raised);border:1px solid transparent;border-radius:5px;padding:6px 8px 6px 6px;cursor:pointer}
#brief .shell-bul.noimg{grid-template-columns:minmax(0,1fr);padding-left:10px}
#brief .shell-bul:hover{border-color:var(--sodium)}
#brief .shell-bul img{width:64px;height:48px;object-fit:cover;border-radius:3px;background:#000}
#brief .shell-bul .t{display:block;font-size:.88rem;line-height:1.35}
#brief .shell-time{display:inline-block;margin:4px 8px 0 0;font-family:var(--mono);font-size:.74rem;color:var(--sodium);border:1px solid rgba(242,169,59,.45);border-radius:99px;padding:0 7px}
#brief .shell-go{display:inline-block;margin-top:4px;font-size:.74rem;color:var(--dim)}
#brief .shell-brief-hon{margin:0;color:var(--dim);font-size:.86rem}
#brief .shell-brief-hon b{font-family:var(--display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:.72rem;margin-right:8px;color:#B5C0CE}
html.stm-demo{font-size:18px}
html.stm-demo body{font-size:16.5px}
html.stm-demo .osd{font-size:.95rem}
html.stm-demo #camsel,html.stm-demo footer,html.stm-demo .mode[data-mode="flow"]{display:none}
@media (max-width:560px){#brief .shell-brief-h{font-size:1.3rem}#brief.shell-collapsed .shell-brief-h{font-size:1.05rem}.shell-camtag{max-width:100%}}
</style>
<style data-owner="ui-ask">
.askv .askv-v{font-family:var(--display);font-weight:700;line-height:1;letter-spacing:.01em;font-size:clamp(2.6rem,11vw,4.5rem);max-width:100%;overflow-wrap:anywhere}
.askv .askv-v.sm{font-size:clamp(1.7rem,7vw,2.8rem)}
.askv .askv-yes{color:var(--present)}.askv .askv-no{color:var(--gone)}.askv .askv-other{color:var(--sodium)}
.askv .askv-hatch{display:inline-block;align-self:flex-start;padding:.1em .3em .06em;border:1px solid var(--blind);border-radius:6px;color:var(--ink);background:repeating-linear-gradient(135deg,rgba(107,119,138,.42) 0 10px,rgba(107,119,138,.12) 10px 20px)}
.askv .askv-plain{margin:0;color:var(--dim);font-size:1rem}
.askv .askv-plain s{text-decoration-thickness:2px;text-decoration-color:var(--gone)}
.askv .askv-why{margin:0;font-size:1.12rem;font-weight:600}
.askv .askv-why b{font-family:var(--mono);font-weight:500;color:var(--sodium);font-variant-numeric:tabular-nums}
.askv .askv-lead{margin:0;font-size:1.08rem;max-width:56ch}
.askv .askv-tiles{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;max-width:520px}
.askv .askv-tiles figure{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.askv .askv-tiles figcaption{font-family:var(--mono);font-size:.74rem;letter-spacing:.04em;color:var(--ink)}
.askv .askv-tile{width:100%;aspect-ratio:4/3;object-fit:contain;display:block;background:#000;border:1px solid var(--line);border-radius:4px}
.askv .askv-static{background:repeating-linear-gradient(90deg,rgba(255,255,255,.1) 0 1px,transparent 1px 3px,rgba(0,0,0,.3) 3px 4px,transparent 4px 7px),repeating-linear-gradient(0deg,#5d6573 0 1px,#2b313b 1px 3px,#858fa0 3px 4px,#3b424d 4px 6px);background-size:7px 100%,100% 6px;animation:askv-snow .2s steps(3) infinite}
@keyframes askv-snow{to{background-position:7px 0,0 6px}}
.askv .askv-arrow{font-size:1.4rem;color:var(--dim)}
.askv .askv-mini .strip{padding:0;border-top:0}
.askv .askv-mini:not(.askv-still) rect[fill="none"]{animation:askv-pulse .9s ease-in-out infinite alternate}
@keyframes askv-pulse{from{opacity:1}to{opacity:.15}}
.askv .askv-src{color:var(--dim)}
.askv .askv-near{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:12px}
@media (max-width:560px){.askv .askv-tiles{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.askv .askv-arrow{display:none}}
</style>
<style data-owner="ui-rewind">
/* ui-rewind: Rewind view only. Every selector sits under .syn-desk, or body:has(.syn-desk) for the thesis clamp. */

.syn-desk .syn-legend svg{width:14px;height:10px;display:inline-block;flex:none}
.syn-desk .syn-legend{gap:4px 12px}

.syn-desk .syn-msg{margin:0 12px 12px}

</style>
<style data-owner="ui-diff">
/* ui-diff: Yesterday vs today. Selectors prefixed .dv- / #dv-. */
.dv-plate{position:relative;line-height:0;background:#000;touch-action:pan-y;cursor:ew-resize;user-select:none;-webkit-user-select:none}
.dv-plate svg{display:block;width:100%;height:auto}
.dv-plate .dv-handle{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--sodium);pointer-events:none;box-shadow:0 0 0 1px rgba(10,15,24,.45)}

.dv-plate.dv-blinking .dv-tag{text-transform:uppercase;font-size:.9rem;font-weight:500;max-width:calc(100% - 20px)}
.dv-plate .dv-nc{fill:none;stroke:#C9D3E0;stroke-width:1.5;stroke-dasharray:6 5;opacity:.85;vector-effect:non-scaling-stroke}

.dv-plate .dv-chg.dv-same{stroke-width:1.5;opacity:.75}

.dv-plate.dv-blinking .dv-chg:not(.dv-same){animation:dv-pulse .9s ease-in-out infinite}
.dv-plate .dv-chg.dv-flash{stroke-width:6;opacity:1;animation:dv-pulse .6s ease-in-out 3}
.dv-root .dv-line{margin:0;padding:10px 12px 0;font-size:.9rem;color:#C4CDD9}
.dv-root .dv-pluto{margin:0;padding:0 12px 10px;font-size:.8rem;color:var(--dim);font-style:italic}

.dv-root .dv-card{grid-template-columns:minmax(0,1fr);gap:6px}

.dv-root .dv-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}

<body>
<svg class="shell-defs" width="0" height="0" aria-hidden="true" focusable="false"><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#2A3442"/><line y2="6" stroke="#8C99AB" stroke-width="2"/></pattern></defs></svg>
<header class="bar">
  <div class="brand"><h1>TIME <b>SEARCH</b></h1><span class="shell-camtag" id="camid">—</span><span class="shell-badge" id="databadge" hidden></span></div>
  <label class="cams" id="camsel"><span class="label" style="margin-right:6px">Camera</span><select id="cams" aria-label="Camera"></select></label>
  <nav class="modes" role="tablist" aria-label="Views">
    <button class="mode" role="tab" data-mode="near" aria-selected="true">Who came near</button>
    <button class="mode" role="tab" data-mode="diff" aria-selected="false">Yesterday vs today</button>
    <button class="mode" role="tab" data-mode="ask" aria-selected="false">Ask</button>
    <button class="mode" role="tab" data-mode="synopsis" aria-selected="false">Rewind</button>
    <button class="mode" role="tab" data-mode="captions" aria-selected="false">Check the AI</button>
    <button class="mode" role="tab" data-mode="flow" aria-selected="false" hidden>Where they go</button>
  </nav>
</header>
<section id="brief" class="shell-brief" hidden aria-label="The 10-second answer"></section>

<section class="thesis"><h2 id="thesis">Every car that passed, all on screen at once.</h2><p id="sub"></p></section>
<main id="view"></main>
<footer><span id="credit"></span><span id="provenance">Results come from prepared footage outputs. Material marked SIMULATED is staged.</span></footer>

<script>
const S = {cams: [], cam: null, mode: 'synopsis', meta: null, cache: {}};
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Round to tenths first, then split: 59.96 s reads 01:00.0, never 00:60.0.
const mmss = t => { const d = Math.round(Math.max(0, +t || 0) * 10), m = Math.floor(d / 600), s = (d - m * 600) / 10; return `${String(m).padStart(2,'0')}:${s.toFixed(1).padStart(4,'0')}`; };
const COL = {person:'#F2A93B', car:'#7FB6FF', truck:'#9AD1FF', bus:'#9AD1FF', bicycle:'#F28FB4', motorcycle:'#F28FB4'};
const colOf = n => COL[n] || '#C9D3E0';
const WHY = {dark: 'too dark', blur: 'picture blurred', frozen: 'picture froze', blocked: 'view blocked or camera turned away', no_signal: 'no picture', turned_away: 'camera turned away', moved: 'camera moving'};
const why = r => WHY[r] || r || 'unknown';
// Blind seconds: the ledger's own totals first (blind_total_s, blind_by_day), else the union of its blind spans, else a count of blind seconds.
const spanUnion = (spans, a = -Infinity, b = Infinity) => { let tot = 0, end = -Infinity;
  for (const [s, e] of (spans || []).map(x => [Math.max(a, +x.start), Math.min(b, +x.end)]).filter(x => x[1] > x[0]).sort((x, y) => x[0] - y[0])) {
    if (e > end) { tot += e - Math.max(s, end); end = e; } }
  return tot; };
function blindTotal(L){
  if (!L) return 0;
  if (L.blind_total_s != null && isFinite(+L.blind_total_s)) return +L.blind_total_s;
  if (Array.isArray(L.blind)) return spanUnion(L.blind);
  return (L.per_second || []).filter(p => !p.visible).length;
}
function blindByDay(L, days){   // [{id, label, s}] per recording day
  if (L && Array.isArray(L.blind_by_day) && L.blind_by_day.length) return L.blind_by_day.map(x => ({id: x.day, label: x.label || String(x.day ?? ''), s: +x.blind_s || 0}));
  return (days || []).map(d => ({id: d.id, label: d.label || String(d.id ?? ''), s: L && Array.isArray(L.blind) ? spanUnion(L.blind, +d.start || 0, d.end != null ? +d.end : Infinity) : 0}));
}
const BAKED = window.__STM__ || null, FILES = window.__STM_FILES__ || {};
const F = p => (p && FILES[p]) || p;
const asset = (cam, p) => p ? F(`out/${cam}/${p}`) : '';

async function getJSON(url){
  if (url in S.cache) return S.cache[url];
  if (BAKED) return (S.cache[url] = BAKED[url] ?? null);
  let v = null;
  try { const r = await fetch(url); if (r.ok) v = await r.json(); } catch(e) {}
  S.cache[url] = v; return v;
}
function empty(msg){ return `<div class="stage"><div class="rows"><p class="empty">${esc(msg)}</p></div></div>`; }
function img(src, cls='crop', alt=''){ return src ? `<img class="${cls}" src="${esc(src)}" alt="${esc(alt)}" loading="lazy" onerror="this.hidden=true">` : ''; }

const THESIS = {
  synopsis: ['Every car that passed, all on screen at once.', 'The whole recording squeezed into under a minute. Each ghost is a real car or person, stamped with the time it was really there. Click one to see it.'],
  diff: ['What changed between yesterday and today?', 'Drag across the street. Every parked car is matched across the two days: same car, gone, new, moved, or a different car in the same spot. Where one day\'s camera never looked, nothing is compared.'],
  near: ['Your car got dented. Who came close?', 'Pick a parked car. You see who came close to it in the picture, on foot or driving past, and every second the camera could not see. It shows who was near, never who did it.'],
  flow: ['Where does everyone go?', 'Every path walked or driven, drawn as light. The brightest trails are the busiest routes.'],
  ask: ['Ask the camera. When it could not see, it says so.', 'Answers come from the tracked record of every object, not a video model, so each one is instant and cites a frame and a time. If the camera was turned away it answers CAN\'T TELL, and it never says who did it.'],
  captions: ['Can you trust the AI\'s descriptions?', 'Each 5-second description written by a video model, checked against what the object detector actually counted. Neither AI is trusted alone.'],
};

async function init(){
  const P = new URLSearchParams(location.search);
  Object.assign(S, {mode: 'near', demo: P.get('demo') === '1', all: P.get('all') === '1', focus: null, askQ: null, leave: [], rt: 0, briefOpen: null});
  document.documentElement.classList.toggle('stm-demo', S.demo);
  const fl = $('.mode[data-mode="flow"]'); if (fl) fl.hidden = !S.all;
  let cams = await getJSON('api/cams');
  if (!Array.isArray(cams)) cams = await getJSON('out/cams.json');
  if (cams && !Array.isArray(cams)) cams = cams.cams;
  const list = ((cams && cams.length) ? cams : ['ptz_parking']).map(c => typeof c === 'string' ? {camera: c} : c).filter(c => c && c.camera);
  // Titles, days and the simulated flag come from each camera's meta.json (the baked export lists only ids).
  const all = await Promise.all(list.map(async c => ({...c, ...((await getJSON(`out/${c.camera}/meta.json`)) || {}), camera: c.camera})));
  const want = P.get('cam');
  let shown = all.filter(c => S.all || !DEV_HIDE.includes(c.camera) || c.camera === want);
  if (!shown.length) shown = all;
  shown.sort((a, b) => isEventCam(b) - isEventCam(a));   // event footage first, otherwise server order
  S.cams = shown.map(c => c.camera);
  S.home = S.cams[0];
  $('#cams').innerHTML = shown.map(c => `<option value="${esc(c.camera)}">${esc(c.title || c.camera.replace(/_/g, ' '))}</option>`).join('');
  $('#cams').onchange = e => { shellTouched(); setCam(e.target.value); try { const u = new URL(location.href); u.searchParams.set('cam', e.target.value); history.replaceState(null, '', u); } catch(x) {} };
  $('nav.modes').onclick = e => { const b = e.target.closest('.mode'); if (b) { shellTouched(); setMode(b.dataset.mode); } };
  const [h, arg] = (location.hash || '').slice(1).split('/');
  if (THESIS[h] && (h !== 'flow' || S.all)) S.mode = h;
  if (arg && S.mode === 'near' && /^\d+$/.test(arg)) S.focus = {object_id: +arg};
  if (arg && S.mode === 'ask') { try { S.askQ = decodeURIComponent(arg); } catch(x) {} }
  markMode(S.mode);
  if (S.demo) addEventListener('keydown', shellKeys);
  await setCam(S.cams.includes(want) ? want : S.home);
}
async function setCam(cam){
  S.cam = cam;
  const meta = await shellCamPick(cam);
  if (S.cam !== cam) return;   // a later camera switch won
  S.meta = meta || {camera: cam, w: 1280, h: 720, duration: 0, days: [], simulated: []};
  shellCamUI(cam);
  renderBrief(cam);
  render();
}
function setMode(m){ markMode(m); render(); }
async function render(){
  for (const f of (S.leave || []).splice(0)) { try { f(); } catch(e) {} }
  const [t, s] = THESIS[S.mode] || THESIS.near;
  $('#thesis').textContent = t;
  const sim = (S.meta.simulated || []).length ? ` <span class="sim">SIMULATED: ${esc(S.meta.simulated.join('; '))}</span>` : '';
  $('#sub').innerHTML = esc(s) + sim;
  // Each render draws into a fresh pane, so a slow earlier view can only write into a detached pane.
  const v = document.createElement('div'), tok = S.rt = (S.rt || 0) + 1;
  v.className = 'shell-pane';
  v.innerHTML = `<p class="empty shell-loading">Loading…</p>`;
  $('#view').replaceChildren(v);
  const fn = {synopsis: viewSynopsis, diff: viewDiff, near: viewNear, flow: viewFlow, ask: viewAsk, captions: viewCaptions}[S.mode] || viewNear;
  try { await fn(v); }
  catch (e) { console.error(e); if (tok === S.rt && v.querySelector('.shell-loading')) v.innerHTML = empty('This view could not be drawn for this camera. Try another tab.'); }
  if (tok === S.rt && v.isConnected) shellAfterRender(v);
}

/* ---------- Shell: presenter keys, deep links, brief (ui-shell) ---------- */
/* Shell state other views may read: S.demo (presenter mode, ?demo=1), S.all (?all=1), S.home (default camera),
   S.focus = {object_id} (near: pre-pick this target, then set S.focus.done = true), S.askQ (ask: pre-fill this
   question and set S.askQ = null; otherwise the shell submits #askf itself), S.leave (push cleanup functions,
   e.g. () => clearInterval(id); render() runs and empties them before drawing the next view). */
const DEV_HIDE = ['car_detection', 'rochester_night', 'person_bicycle_car_detection'];
const isEventCam = m => !!m && (/^neighbou?rhood/i.test(m.camera || '') || (!(m.simulated || []).length && (m.days || []).length >= 2));
function shellKeys(e){
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  const el = e.target;
  if (el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName || ''))) return;
  const k = e.key, go = {'1': 'near', '2': 'diff', '3': 'ask', '4': 'synopsis', '5': 'captions'}[k];
  if (!go && !['6', '0', 'Escape'].includes(k)) return;
  e.preventDefault();
  if (k === '0') { S.briefOpen = true; briefApply(); scrollTo({top: 0, behavior: 'smooth'}); return; }
  shellTouched(); scrollTo({top: 0});
  if (go) return setMode(go);
  S.focus = null; S.askQ = null;
  const cam = k === '6' ? 'ptz_parking' : S.home;
  markMode(k === '6' ? 'synopsis' : 'near');
  if (S.cam !== cam) setCam(cam); else render();
}
function shellCamPick(cam){
  const sel = $('#cams');
  if (![...sel.options].some(o => o.value === cam)) sel.insertAdjacentHTML('beforeend', `<option value="${esc(cam)}">${esc(cam.replace(/_/g, ' '))}</option>`);
  sel.value = cam;
  return getJSON(`out/${cam}/meta.json`);
}
function shellCamUI(cam){   // header title, honest data badge and footer credit for the current camera
  const M = S.meta, sim = (M.simulated || []).length, ev = !sim && isEventCam(M), days = M.days || [];
  const synthetic = (M.simulated || []).some(s => /synthetic/i.test(s));
  $('#camid').textContent = M.title || cam.replace(/_/g, ' ');
  $('#camid').title = `Camera id: ${cam}`;
  const bd = $('#databadge');
  bd.hidden = false;
  bd.className = 'shell-badge ' + (sim ? 'sim' : ev ? 'real' : 'sample');
  bd.textContent = synthetic ? 'SYNTHETIC DEMO' : sim ? 'SIMULATED days' : ev ? `Event footage · ${days.length} real day${days.length === 1 ? '' : 's'}` : 'Sample clip';
  bd.title = sim ? M.simulated.join('; ') : ev ? days.map(d => d.label || d.id).join(' and ') : 'Public sample footage used to build and test this';
  $('#credit').textContent = M.credit ? synthetic ? `Fixture: ${M.credit}.` : `Footage: ${M.credit}.` : '';
  $('#provenance').textContent = synthetic ? 'Synthetic demo: an illustrated scene and preset events. This fixture uses no video or model inference.' : 'Results come from prepared footage outputs. Material marked SIMULATED is staged.';
}
function markMode(m){
  if (!THESIS[m] || (m === 'flow' && !S.all)) m = 'near';
  S.mode = m;
  document.querySelectorAll('.mode').forEach(b => b.setAttribute('aria-selected', b.dataset.mode === m));
  try { history.replaceState(null, '', '#' + m); } catch(e) {}
}
function shellAfterRender(v){
  const f = S.focus;
  if (S.mode === 'near' && f && f.object_id != null && !f.done) {
    f.done = true;
    const el = v.querySelector(`[data-object-id="${f.object_id}"],[data-target="${f.object_id}"]`);
    if (el) el.click();
    else getJSON(`out/${S.cam}/near.json`).then(N => {
      const i = N && N.targets ? N.targets.findIndex(t => t.object_id === f.object_id) : -1;
      const b = i >= 0 && v.isConnected && v.querySelector(`#tl [data-i="${i}"]`); if (b) b.click(); });
  }
  if (S.mode === 'ask' && S.askQ) {
    const q = S.askQ; S.askQ = null;
    setTimeout(() => { const inp = v.querySelector('#q'), form = v.querySelector('#askf');
      const chip = v.isConnected && [...v.querySelectorAll('[data-q]')].find(c => c.dataset.q === q); if (chip) return chip.click();
      if (!inp || !form || !v.isConnected) return; inp.value = q;
      if (form.requestSubmit) form.requestSubmit(); else form.dispatchEvent(new Event('submit', {cancelable: true})); }, 350);
  }
}
function briefApply(){
  const el = $('#brief'); if (!el) return;
  let open = S.briefOpen;
  if (open == null) { open = !S.demo; try { if (localStorage.getItem('stm.brief.collapsed') === '1') open = false; } catch(e) {} }
  el.classList.toggle('shell-collapsed', !open);
  const tg = el.querySelector('.shell-brief-tog');
  if (tg) { tg.setAttribute('aria-expanded', open); tg.textContent = open ? 'Hide details' : 'Show details'; }
}
function shellTouched(){   // the first navigation collapses the brief to its headline, remembered per viewer
  if (S.briefOpen === false) return;
  S.briefOpen = false;
  if (!S.demo) { try { localStorage.setItem('stm.brief.collapsed', '1'); } catch(e) {} }
  briefApply();
}
async function renderBrief(cam){
  const el = $('#brief'); if (!el) return;

  const srcLine = res => res.live ? `answered in <span class="mono">${Math.max(1, Math.round(res.rtt))} ms</span>` : 'from the saved record';
  const evLine = r => { const ev = r.evidence || []; return `<div class="thumbs">${ev.filter(e => e.crop).slice(0, 6).map(e => img(asset(cam, e.crop), '', `object ${e.object_id}`)).join('')}</div>
    ${ev.length ? `<div class="counts">Evidence: ${ev.slice(0, 6).map(e => `#${esc(e.object_id)} at ${mm(e.t)}`).join(' · ')}</div>` : ''}`; };
  // One answer card. Returns the draw options for the plate (the CAN'T TELL beat sets opt.cant).
  const card = (res, ctx = {}) => {
    const r = res.r, verdict = String(r.answer ?? ''), unk = /^unknown/i.test(verdict) && r.type !== 'unknown';
    const head = `<div class="label">${esc((r.type || '').replace(/_/g, ' '))} · <span class="askv-src">${srcLine(res)}</span></div>`;
    const noLooks = s => String(s || '').replace(/\b(person|people|pedestrian|cyclist)( #\d+)? \(in [a-z ]+\)/gi, '$1$2');   // older saved records named a person's clothing colour
    const tail = `<p style="margin:0;font-size:1.05rem">${esc(noLooks(r.sentence))}</p>${r.honesty ? `<p class="honesty">${esc(noLooks(r.honesty))}</p>` : ''}${evLine(r)}`;
    if (r.refused) { const b = r.refused === 'blame';   // the engine refused a question the page's own check let through
      return {html: `<div class="label">${b ? 'who did it' : 'people'} · refused by design · <span class="askv-src">${srcLine(res)}</span></div>
        <div class="askv-v ${b ? '' : 'sm '}askv-hatch">${b ? "CAN'T SAY WHO" : "WON'T SEARCH BY LOOKS"}</div>${tail}`, opt: {}}; }
    if (!unk) {
      const cls = /^yes/i.test(verdict) ? 'yes' : /^no\b/i.test(verdict) ? 'no' : 'other', big = verdict.length <= 12 && r.type !== 'unknown';
      return {html: `${head}<div class="askv-v ${big ? '' : 'sm'} askv-${cls}">${esc(r.type === 'unknown' ? 'NOT UNDERSTOOD' : verdict)}</div>${tail}`, opt: {}};
    }
    const ev = (r.evidence || []).filter(e => e && e.t != null);
    const last = r.last_seen != null ? +r.last_seen : ev.length ? Math.max(...ev.map(e => +e.t)) : null;
    const lastEv = ev.filter(e => e.box || e.crop).sort((a, b) => b.t - a.t)[0];
    const span = last == null ? null : spansOf(r).find(s => s.end > last + 0.01 && s.start - last <= 60);
    let beat = '', opt = {};
    if (span) {
      const [why, lab] = whyOf(span, r), range = `${mm(span.start)}–${mm(span.end)}`;
      beat = `${r.type === 'still_there' ? `<p class="askv-plain"><s>A plain tracker would say: NO, it left at ${mm(last)}.</s></p>
        <p class="askv-why">Why that's wrong: ${esc(why)} <b>${range}</b>.</p>` : `<p class="askv-why">${esc(why[0].toUpperCase() + why.slice(1))} <b>${range}</b>.</p>`}
        <div class="askv-tiles"><figure>${lastEv && lastEv.crop ? img(asset(cam, lastEv.crop), 'askv-tile', 'last seen') : '<div class="askv-tile"></div>'}<figcaption>LAST SEEN ${mm(last)}</figcaption></figure>
          <span class="askv-arrow" aria-hidden="true">→</span>
          <figure><div class="askv-tile askv-static" role="img" aria-label="${esc(lab.toLowerCase())}"></div><figcaption>${esc(lab)} ${range}</figcaption></figure></div>
        ${L ? `<div class="askv-mini">${ledgerStrip(L, meta.duration || L.seconds, [[span.start, span.end]])}</div>` : ''}`;
      opt = {t: last, cant: {box: lastEv && lastEv.box, last: mm(last), label: `${lab} ${range}`}};
    } else if (last != null) opt = {t: last};
    return {html: `${head}<div class="askv-v askv-hatch">CAN'T TELL</div>${beat}${tail}`, opt};
  };
  const fetchAnswer = async (q, t) => {
    const t0 = performance.now();
    if (!BAKED) try {
      const x = await fetch(`api/ask?cam=${encodeURIComponent(cam)}&q=${encodeURIComponent(q)}${t != null ? `&t=${encodeURIComponent(t)}` : ''}`);
      if (x.ok) { const j = await x.json(); if (j && j.answer != null) return {r: j, live: true, rtt: performance.now() - t0}; }
    } catch(e) {}
    const hit = items.find(x => x.a && norm(x.q) === norm(q));
    return hit ? {r: hit.a, live: false} : null;
  };
  const NOLIVE = '<p class="empty">This copy of the app runs without the live engine, so it can only answer the saved questions. Pick one above.</p>';
  let seq = 0;
  const ask = async (q, t = null) => {
    const my = ++seq; $('#q', v).value = q;
    v.querySelectorAll('.chip[data-q]').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.q === q)));
    if (byLooks(q)) {
      ans.innerHTML = `<div class="label">people · refused by design</div><div class="askv-v sm askv-hatch">WON'T SEARCH BY LOOKS</div>
        <p class="askv-lead">Time Search never describes or searches people by how they look: no clothing, skin, gender or face. Ask about vehicles, or who came near a car.</p>`;
      drawEvidence({evidence: []}); return;
    }
    if (BLAME.test(q)) {
      let phrase = objOf(q);
      if (!phrase && !PERSON.test(q)) phrase = defPhrase;
      else if (/^the \w+$/i.test(phrase) && !items.some(x => norm(x.q).includes(norm(phrase)))) phrase = defPhrase;   // "my car" -> the demo's car
      ans.innerHTML = `<div class="label">who did it · refused by design</div><div class="askv-v askv-hatch">CAN'T SAY WHO</div>
        <p class="askv-lead">A camera can't tell who did it. Here is who came near it, and every second it couldn't see.</p>
        ${phrase ? `<div class="askv-near" id="anear"><p class="empty">Checking who came near ${esc(phrase)}…</p></div>` : ''}
        ${L ? `<div class="askv-mini askv-still">${ledgerStrip(L, meta.duration || L.seconds)}</div>` : ''}`;
      drawEvidence({evidence: []});
      if (!phrase) return;
      const nItem = items.find(x => x.type === 'who_near' && x.a && norm(x.q).includes(norm(phrase))) || (phrase === defPhrase && near0 && near0.a ? near0 : null);
      const res = await fetchAnswer(`Who came near ${phrase}?`, nItem ? nItem.t : null) || (nItem ? {r: nItem.a, live: false} : null);
      if (my !== seq) return;
      const box = $('#anear', v); if (!box) return;
      if (!res) { box.innerHTML = NOLIVE; return; }
      const c = card(res); box.innerHTML = c.html; drawEvidence(res.r, c.opt); return;
    }
    ans.innerHTML = '<p class="empty">Checking the record…</p>';
    const res = await fetchAnswer(q, t);
    if (my !== seq) return;
    if (!res) { ans.innerHTML = NOLIVE; drawEvidence({evidence: []}); return; }
    const c = card(res); ans.innerHTML = c.html; drawEvidence(res.r, c.opt);
  };
  $('#askf', v).onsubmit = e => { e.preventDefault(); const q = $('#q', v).value.trim(); if (!q) return; const it = items.find(x => norm(x.q) === norm(q)); ask(q, it ? it.t : null); };
  v.querySelectorAll('.chip[data-q]').forEach(c => c.onclick = () => ask(c.dataset.q, c.dataset.t != null && c.dataset.t !== '' ? +c.dataset.t : null));
}
/* Ask plate + boxes. The plate is the background of the answer's own day (background_<day id>.jpg), never the
   two-day blend; boxes are drawn only for evidence from that day. opt.t pins the day; opt.cant plays the
   "camera could not see" beat (last-seen box -> TV snow -> grey wash); opt.still skips animation (resize). */
async function drawEvidence(r, opt = {}){
  const cv = $('#aov'), plate = $('#aplate'), osd = $('#aosd'); if (!cv) return;
  const tok = drawEvidence.tok = (drawEvidence.tok || 0) + 1;
  drawEvidence.last = {r, opt};
  if (!drawEvidence.rs) { drawEvidence.rs = 1; addEventListener('resize', () => { const l = drawEvidence.last; if (l && $('#aov')) drawEvidence(l.r, {...l.opt, still: true}); }); }
  const meta = S.meta || {}, cam = S.cam, days = (meta.days || []).filter(d => d && d.id != null);
  const ev = ((r && r.evidence) || []).filter(e => e && e.t != null);
  const dayAt = t => days.find(d => t >= +d.start && t < +d.end) || (days.length && t >= +days[days.length - 1].start ? days[days.length - 1] : days[0]) || null;
  let day = days[0] || null;
  if (opt.t != null) day = dayAt(+opt.t);
  else if (ev.length && days.length) {   // the day most of the evidence comes from; a tie goes to the later day
    const n = new Map(); for (const e of ev) { const d = dayAt(+e.t); n.set(d, (n.get(d) || 0) + 1); }
    day = [...n.entries()].sort((a, b) => b[1] - a[1] || (+b[0].start) - (+a[0].start))[0][0];
  }
  const fb = (!day || !(meta.simulated || []).length) ? asset(cam, 'background.jpg') : '';
  const want = day ? asset(cam, `background_${day.id}.jpg`) : fb;
  if (osd) osd.textContent = `RECORDED · ${meta.title || cam}${day ? ' · ' + (day.label || day.id) : ''}`;
  if (plate && want && plate.dataset.want !== want) {
    plate.dataset.want = want; plate.dataset.fb = want === fb ? '' : fb; plate.style.visibility = '';
    plate.onerror = () => { const f = plate.dataset.fb; plate.dataset.fb = ''; if (f) plate.src = f; else plate.style.visibility = 'hidden'; };
    await new Promise(res => { const done = () => res(); plate.addEventListener('load', done, {once: true}); plate.addEventListener('error', done, {once: true}); setTimeout(done, 1500); plate.src = want; });
    if (tok !== drawEvidence.tok) return;
  }
  const rr = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1, ctx = cv.getContext('2d');
  cv.width = Math.max(1, Math.round(rr.width * dpr)); cv.height = Math.max(1, Math.round(rr.height * dpr)); ctx.clearRect(0, 0, cv.width, cv.height);
  const sx = cv.width / (meta.w || 1280), sy = cv.height / (meta.h || 720);
  const box = (b, dashed) => { const X = b[0] * sx, Y = b[1] * sy, W = (b[2] - b[0]) * sx, H = (b[3] - b[1]) * sy;
    ctx.setLineDash(dashed ? [8 * dpr, 5 * dpr] : []); ctx.lineWidth = 5 * dpr; ctx.strokeStyle = '#000'; ctx.strokeRect(X, Y, W, H);
    ctx.lineWidth = 3 * dpr; ctx.strokeStyle = '#fff'; ctx.strokeRect(X, Y, W, H); ctx.setLineDash([]); };
  const tag = (b, text) => { ctx.font = `500 ${12 * dpr}px "IBM Plex Mono", ui-monospace, monospace`; ctx.textBaseline = 'middle';
    const w = ctx.measureText(text).width + 10 * dpr, h = 18 * dpr; let x = Math.min(Math.max(0, b[0] * sx), cv.width - w), y = b[1] * sy - h - 4 * dpr;
    if (y < 0) y = Math.min(cv.height - h, b[3] * sy + 4 * dpr);
    ctx.fillStyle = 'rgba(10,15,24,.88)'; ctx.fillRect(x, y, w, h); ctx.fillStyle = '#fff'; ctx.fillText(text, x + 5 * dpr, y + h / 2); };
  const inDay = e => !day || !days.length || dayAt(+e.t) === day;
  if (opt.cant) {
    const c = opt.cant, anim = !opt.still && !matchMedia('(prefers-reduced-motion: reduce)').matches;
    const wait = ms => new Promise(res => setTimeout(res, ms));
    if (anim && c.box) { box(c.box, false); tag(c.box, `LAST SEEN ${c.last}`); await wait(700); if (tok !== drawEvidence.tok) return; }
    if (anim) {   // 1.2 s of TV snow: 160x90 noise blown up with no smoothing
      const off = document.createElement('canvas'); off.width = 160; off.height = 90;
      const oc = off.getContext('2d'), id = oc.createImageData(160, 90), d = id.data, t0 = performance.now();
      await new Promise(res => { const step = now => { if (tok !== drawEvidence.tok) return res();
        for (let i = 0; i < d.length; i += 4) { const g = (Math.random() * 255) | 0; d[i] = d[i + 1] = d[i + 2] = g; d[i + 3] = 255; }
        oc.putImageData(id, 0, 0); ctx.imageSmoothingEnabled = false; ctx.drawImage(off, 0, 0, cv.width, cv.height);
        if (now - t0 < 1200) requestAnimationFrame(step); else res(); }; requestAnimationFrame(step); setTimeout(res, 2500); });
      if (tok !== drawEvidence.tok) return;
    }
    ctx.clearRect(0, 0, cv.width, cv.height); ctx.fillStyle = 'rgba(64,72,86,.8)'; ctx.fillRect(0, 0, cv.width, cv.height);
    if (c.box) { box(c.box, true); tag(c.box, `LAST SEEN ${c.last}`); }
    if (c.label) { ctx.font = `600 ${Math.max(14, Math.round(cv.width / 34))}px "IBM Plex Sans Condensed", "Arial Narrow", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(10,15,24,.7)'; const w = ctx.measureText(c.label).width + 24 * dpr, h = Math.round(cv.width / 34) + 16 * dpr;
      const cy = cv.height - h / 2 - 12 * dpr;   // bottom centre: the OSD owns the top-left corner
      ctx.fillRect(cv.width / 2 - w / 2, cy - h / 2, w, h); ctx.fillStyle = '#E6ECF4'; ctx.fillText(c.label, cv.width / 2, cy); ctx.textAlign = 'start'; }
    return;
  }
  const seen = new Set();
  for (const e of ev) { if (!e.box || e.box.length < 4 || !inDay(e)) continue; const k = `${e.object_id}:${e.box.map(Math.round).join(',')}`; if (seen.has(k)) continue; seen.add(k); box(e.box, false); }
  const tagged = new Set();
  for (const e of ev) { if (!e.box || e.box.length < 4 || !inDay(e) || tagged.has(e.object_id)) continue; tagged.add(e.object_id); tag(e.box, `#${e.object_id}`); }
}

/* ---------- Check the AI ---------- */
async function viewCaptions(v){
  // Two sources: the event camera's own Cosmos captions (out/captions/<cam>.json, one detector = one witness)
  // and the practice corpus (out/captions/captions.json: the drone and the bolt).
  const P = await getJSON('out/captions/captions.json');
  const R = S.cam ? await getJSON(`out/captions/${S.cam}.json`) : null;
  if (!P && !R) { v.innerHTML = empty('The caption check has not been built yet.'); return; }
  const cap = p => p ? F('out/captions/' + p) : '';
  const nm = (n, k) => k === 1 ? n : (n === 'person' ? 'people' : /s$/.test(n) ? n : n + 's');
  const counts = o => { const e = Object.entries(o || {}).filter(([, k]) => k > 0).sort((a, b) => b[1] - a[1]); return e.length ? e.map(([n, k]) => `${k}× ${n}`).join(' · ') : 'nothing'; };
  const said = r => { const e = Object.entries(r.claimed_counts || {}); return e.length ? e.map(([n, k]) => k === 0 ? `no ${nm(n, 0)}` : k == null ? `${n} (no number)` : `${k}× ${n}`).join(' · ') : 'nothing countable'; };
  const APPEAR = /\b(blonde|brunette|hair|t-shirt|tshirt|shirt|skirt|heels|jacket|jeans|cap|hat|top|shorts|outfit|dress|coat|hoodie|pants|trousers|sweater|clothing|clothes|wearing)\b/gi;
  const hl = (text, r) => {
    const bad = new Set((r.checks || []).filter(c => ['unseen', 'count_off'].includes(c.status)).map(c => c.object));
    let s = esc(text);
    for (const c of (r.claims || [])) { if (!c.text) continue; const k = esc(c.text); s = s.split(k).join(`<mark class="${bad.has(c.object) ? 'bad' : ''}">${k}</mark>`); }
    return s.replace(APPEAR, w => `<span class="cx-app" title="appearance: not checked, not used">${w}</span>`);
  };
  const verdict = r => r.verdict === 'contradiction' ? `<span class="pill contradiction">Doesn't match</span>`
    : r.verdict === 'unverifiable' ? `<span class="pill unverifiable">Can't check</span>`
    : r.class_differs ? `<span class="pill cx-amber" title="The two AIs split car / van / truck differently">Backed up · car/truck split</span>`
    : r.count_differs ? `<span class="pill cx-amber" title="Same things seen, numbers differ">Backed up · count differs</span>`
    : `<span class="pill consistent">Backed up</span>`;
  // Event rows sit on the camera timeline, the same clock as Who came near, Ask and Rewind ("2 Sep · 18:09" there means 18:09 here too).
  const when = r => r.day ? `${esc(r.day_label || r.day)} · ${mmss(r.start)}–${mmss(r.end)}` : `${esc(r.clip)} · ${mmss(r.start)}–${mmss(r.end)}`;
  const row = (r, live) => `<div class="row cx-row${r.strip || r.frame ? '' : ' cx-nopic'}">${r.strip ? img(cap(r.strip), 'cx-rowstrip', '6 frames from this segment') : img(cap(r.frame), '', 'frame from this segment')}
    <div class="cx-body"><div>${verdict(r)} <span class="counts">${when(r)}</span>${r.detector_suspect ? ' <span class="pill moved" title="' + esc(r.detector_reason || '') + '">detector suspect</span>' : ''}${r.repeats ? ` <span class="pill unverifiable">caption repeats ${r.repeats} sentence${r.repeats > 1 ? 's' : ''}</span>` : ''}</div>
      <p class="cx-cap">${hl(r.caption, r)}</p>
      <div class="cx-cols"><div><span class="label">Video AI said</span><b>${esc(said(r))}</b></div>
        <div><span class="label">${live ? 'Detector counted' : "Pipeline's detector counted"}</span><b>${esc(counts(r.pipeline_counts))}</b></div>
        ${r.our_counts != null ? `<div><span class="label">Our tracker counted</span><b>${esc(counts(r.our_counts))}</b></div>` : ''}</div>
      <p class="cx-why">${esc(r.why)}</p>${r.detector_reason ? `<p class="cx-why">Detector suspect: ${esc(r.detector_reason)}</p>` : ''}</div></div>`;
  const stats = (t, nd) => `<div class="stats">
      <div class="stat"><b class="mono" style="color:var(--gone)">${t.contradiction ?? 0}</b><span>doesn't match</span></div>
      <div class="stat"><b class="mono" style="color:var(--present)">${t.consistent ?? 0}</b><span>backed up</span></div>
      ${nd != null ? `<div class="stat"><b class="mono" style="color:var(--sodium)">${nd}</b><span>of those: count or type differs</span></div>` : ''}
      <div class="stat"><b class="mono">${t.unverifiable ?? 0}</b><span>can't check</span></div></div>`;
  const prows = P ? P.rows || [] : [];
  const hero = prows.find(r => r.verdict === 'contradiction' && r.strip) || prows.find(r => r.verdict === 'contradiction');
  const bolt = prows.find(r => r.id === 'bolt-detection_002') || prows.find(r => r.verdict === 'unverifiable' && r.detector_suspect);
  let html = '';
  if (hero) {
    const lie = (hero.checks || []).filter(c => ['unseen', 'count_off'].includes(c.status)).map(c => c.object);
    let q = esc(hero.caption);
    for (const w of lie) q = q.replace(new RegExp(`\\b(${w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}s?)\\b`, 'gi'), '<s class="cx-lie">$1</s>');
    const n = (hero.strip_t || []).length || 6;
    html += `<section class="stage cx-hero"><div class="cx-stampwrap">${hero.strip ? img(cap(hero.strip), 'cx-strip', 'Six frames across the segment') : img(cap(hero.frame), 'cx-strip', 'Frame from the segment')}<span class="cx-stamp">DOESN'T MATCH</span></div>
      <div class="cx-pad"><div class="counts">${hero.start.toFixed(1)} s → ${hero.end.toFixed(1)} s, ${hero.strip ? n + ' frames' : 'middle frame'}</div>
      <blockquote class="cx-quote">“${q}”</blockquote>
      <div class="cx-tiles"><div><span class="label">Video model</span><b>${esc(lie.length ? lie.map(w => 'a ' + w).join(', ') : said(hero))}</b></div>
        <div><span class="label">Pipeline detector</span><b>${esc(counts(hero.pipeline_counts))}</b></div>
        ${hero.our_counts != null ? `<div><span class="label">Our tracker</span><b>${esc(counts(hero.our_counts))}</b></div>` : ''}</div>
      <p class="cx-why">${esc(hero.why)}</p>
      <div class="counts">${esc(hero.model || (P.models || []).join(', '))} · practice corpus</div></div></section>`;
  }
  if (bolt) {
    const thing = ((bolt.why || '').match(/it describes: ([^)]+)/) || [])[1] || 'something else';
    html += `<section class="stage cx-mini">${img(cap(bolt.frame), 'cx-minifr', 'Frame from the bolt clip')}
      <div class="cx-pad"><h3>Neither AI is trusted alone.</h3>
      <p>Detector said: <b>${esc(counts(bolt.pipeline_counts))}</b>. Caption said: <b>a ${esc(thing.split(',')[0])}</b>. The caption was right.</p>
      <div class="counts">Practice corpus · ${esc(bolt.id)}. Each AI checks the other; when only one speaks, we say “can't check”.</div></div></section>`;
  }
  if (R) {
    const rr = R.rows || [], ord = r => r.verdict === 'contradiction' ? 0 : (r.class_differs || r.count_differs) && (r.checks || []).some(c => c.claimed === 0 && c.status !== 'supported') ? 1 : r.class_differs ? 2 : r.verdict === 'unverifiable' ? 4 : 3;
    const sorted = [...rr].sort((a, b) => ord(a) - ord(b) || a.start - b.start), top = sorted.filter(r => ord(r) <= 1), rest = sorted.filter(r => ord(r) > 1);
    const days = (R.days || []).map(d => esc(d.label || d.id)).join(' and ');
    html += `<section class="stage cx-live"><div class="cx-pad"><h3>This camera: ${rr.length} five-second descriptions${days ? ` over ${days}` : ''}</h3>
      <p class="counts">Written by ${esc((R.models || []).join(', ') || 'the video model')}; counted by ${esc((R.detectors || []).join(', ') || 'the detector')}.</p>
      ${stats(R.totals || {}, rr.filter(r => r.verdict === 'consistent' && (r.count_differs || r.class_differs)).length)}
      ${R.witness_note ? `<p class="honesty">${esc(R.witness_note)}</p>` : ''}</div>
      <div class="rows">${top.map(r => row(r, true)).join('') || '<p class="empty">No description on this camera contradicts the detector.</p>'}</div>
      <details class="cx-more"><summary>All other descriptions (${rest.length})</summary><div class="rows">${rest.map(r => row(r, true)).join('')}</div></details></section>`;
  }
  if (P) {
    const others = prows.filter(r => r !== hero && r !== bolt);
    html += `<section class="stage"><div class="cx-pad"><h3>Practice corpus</h3><div class="counts">${esc((P.models || []).join(', '))} · ${prows.length} segments from the organisers' sample clips</div>${stats(P.totals || {}, P.count_differs)}</div>
      <details class="cx-more"><summary>Other clips (${others.length})</summary><div class="rows">${others.map(r => row(r, false)).join('')}</div></details></section>`;
  }
  v.innerHTML = `<div class="cx">${html}</div>`;
}
init();
</script>
