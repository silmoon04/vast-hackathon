<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Time Search</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: operator console. Fixed sidebar, a working column of white cards on a cool grey ground, and the desk agent
   docked on the right. One blue accent; green/amber/red only for state. */
:root{
  --bg:#F2F4F8; --card:#FFFFFF; --sunk:#F7F8FB; --line:#E5E8EF; --line-2:#D9DEE8;
  --ink:#121826; --ink-2:#4D566B; --ink-3:#8C94A8; --ink-4:#B7BDCB;
  --accent:#2F5BEA; --accent-2:#244AC9; --accent-soft:#EDF1FE; --accent-line:#C9D5FB;
  --ok:#14945A; --ok-soft:#E6F6EE; --warn:#C27A00; --warn-soft:#FFF4DE; --bad:#D93F45; --bad-soft:#FDECEC;
  --violet:#7A5AF8; --violet-soft:#F1EDFF;
  --shadow:0 1px 2px rgba(18,24,38,.04),0 2px 8px rgba(18,24,38,.04);
  --shadow-lg:0 12px 40px rgba(18,24,38,.14),0 2px 6px rgba(18,24,38,.06);
  --skel-a:#EDF0F5; --skel-b:#F7F8FB;
  --video-bg:#0E1220;
  --f-display:"Outfit",ui-sans-serif,system-ui,sans-serif;
  --f-serif:"Outfit",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Outfit",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r-sm:8px; --r:12px; --r-lg:16px;
  --ease:cubic-bezier(.2,.8,.2,1); --ease-io:cubic-bezier(.65,0,.35,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D111A; --card:#151A26; --sunk:#111622; --line:#232A3A; --line-2:#2D3548;
  --ink:#EEF1F7; --ink-2:#AEB6C8; --ink-3:#7A8398; --ink-4:#4E576C;
  --accent:#6E8EFF; --accent-2:#8AA3FF; --accent-soft:#1A2340; --accent-line:#2C3B6E;
  --ok:#3DD68C; --ok-soft:#10261C; --warn:#F2B544; --warn-soft:#2A2110; --bad:#FF6B70; --bad-soft:#2C1416;
  --violet:#A58BFF; --violet-soft:#211B3A;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 16px 48px rgba(0,0,0,.5);
  --skel-a:#1B2130; --skel-b:#232A3B; --video-bg:#05070C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D111A; --card:#151A26; --sunk:#111622; --line:#232A3A; --line-2:#2D3548;
  --ink:#EEF1F7; --ink-2:#AEB6C8; --ink-3:#7A8398; --ink-4:#4E576C;
  --accent:#6E8EFF; --accent-2:#8AA3FF; --accent-soft:#1A2340; --accent-line:#2C3B6E;
  --ok:#3DD68C; --ok-soft:#10261C; --warn:#F2B544; --warn-soft:#2A2110; --bad:#FF6B70; --bad-soft:#2C1416;
  --violet:#A58BFF; --violet-soft:#211B3A;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 16px 48px rgba(0,0,0,.5);
  --skel-a:#1B2130; --skel-b:#232A3B; --video-bg:#05070C; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.015em;font-family:var(--f-display)}
.muted{color:var(--ink-3)} .dim{color:var(--ink-2)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- stage: the whole app sits in a camera rig the tour can zoom and pan ---------- */
#stage{position:fixed;inset:0;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
#rig{position:absolute;inset:0;transform-origin:0 0;will-change:transform;transition:transform 1.1s var(--ease-io)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr) auto;height:100%}

/* ---------- sidebar ---------- */
.side{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px 16px;gap:4px;min-height:0;overflow:auto}
.brand{display:flex;align-items:center;gap:9px;padding:2px 8px 14px;font:700 15.5px/1.15 var(--f-display);letter-spacing:-.02em}
.brand svg{flex:none}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--ink-3);letter-spacing:0}
.nav-h{padding:12px 8px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:13.5px;position:relative;transition:background .2s,color .2s}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav a .ico{width:18px;height:18px;flex:none;opacity:.9}
.nav a .badge{margin-left:auto;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--sunk);color:var(--ink-3)}
.nav a.on .badge{background:var(--card);color:var(--accent)}
.nav a .live{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 50%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.side .spacer{flex:1}
.agent-card{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:linear-gradient(180deg,var(--accent-soft),var(--card) 70%);display:grid;gap:8px}
.agent-card .orb{width:30px;height:30px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff}
.agent-card b{font-size:13px}
.agent-card .row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2)}
.agent-card .row span:last-child{font-family:var(--f-mono);color:var(--ink);font-size:11px;text-align:right}
.btn-out{border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad);background:transparent;border-radius:9px;padding:8px;font-weight:500;margin-top:8px}

/* ---------- main column ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--card)}
.top .hello b{display:block;font:italic 400 23px/1.1 var(--f-serif);letter-spacing:0}
.top .hello span{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.top .grow{flex:1}
.cmdk{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:7px 10px;min-width:260px;color:var(--ink-3);font-size:13px}
.cmdk kbd{margin-left:auto;font:11px var(--f-mono);border:1px solid var(--line-2);border-radius:5px;padding:1px 5px;background:var(--card)}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink-2);position:relative}
.icon-btn .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--bad);border:2px solid var(--card)}
.who{display:flex;align-items:center;gap:8px;font-weight:500;font-size:13px;white-space:nowrap}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#2F5BEA,#7A5AF8);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.view-wrap{flex:1;overflow:auto;min-height:0;scroll-behavior:smooth}
#view{padding:20px 24px 40px;max-width:1360px}
.view-title{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.view-title h1{font-size:26px;font-weight:700;letter-spacing:-.03em;font-variation-settings:"opsz" 60}
.view-title h1 em{font:italic 400 28px var(--f-serif);letter-spacing:0;color:var(--accent)}
.view-title p{margin:2px 0 0;color:var(--ink-3);font-size:13px}
.view-title .grow{flex:1}

/* ---------- shared components (views use these) ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:15px;font-weight:650;letter-spacing:-.015em}
.card-h .grow{flex:1}
.card-b{padding:16px}
.grid{display:grid;gap:16px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:9px 14px;font-weight:500;font-size:13.5px;border:1px solid var(--line);background:var(--card);color:var(--ink);transition:transform .15s,background .2s,border-color .2s,box-shadow .2s}
.btn:hover{border-color:var(--line-2);background:var(--sunk)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(47,91,234,.3),inset 0 1px 0 rgba(255,255,255,.15)}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;font-size:12px;color:var(--ink-2);background:var(--card);white-space:nowrap}
button.chip:hover{border-color:var(--accent-line);color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.sim{background:var(--violet-soft);color:var(--violet)} .pill.plain{background:var(--sunk);color:var(--ink-2)}
.ai-banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:linear-gradient(90deg,var(--accent-soft),color-mix(in srgb,var(--accent-soft) 40%,var(--card)));border:1px solid var(--accent-line)}
.ai-banner .spark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.ai-banner b{color:var(--accent);font-size:13px;font-weight:600;display:block}
.ai-banner p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2)}
.tabs{display:flex;gap:4px;position:relative;border-bottom:1px solid var(--line);padding:0 8px}
.tabs button{border:0;background:none;padding:11px 10px;color:var(--ink-3);font-weight:500;font-size:13px;transition:color .2s}
.tabs button.on{color:var(--accent)}
.tabs .ink{position:absolute;bottom:-1px;height:2px;background:var(--accent);border-radius:2px;transition:left .35s var(--ease),width .35s var(--ease)}
.tab-pane{animation:paneIn .35s var(--ease)}
@keyframes paneIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.prog{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.prog > i{display:block;height:100%;width:0;background:var(--accent);border-radius:inherit;transition:width .8s var(--ease)}
.prog.ok > i{background:var(--ok)}
.table{width:100%;border-collapse:collapse;font-size:12.5px}
.table th{text-align:left;font-weight:500;color:var(--ink-3);font-size:11.5px;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.table td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tbody tr{transition:background .15s}
.table tbody tr:hover{background:var(--sunk)}
.scroll-x{overflow-x:auto}
.crop{border-radius:8px;object-fit:cover;background:var(--sunk);display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.stat b{display:block;font:700 26px var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat > span{font-size:12px;color:var(--ink-3)}
.swatch{display:inline-block;width:10px;height:10px;border-radius:3px;border:1px solid rgba(0,0,0,.12);vertical-align:-1px}
.code{font:12px/1.6 var(--f-mono);background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;white-space:pre-wrap;color:var(--ink-2);overflow-x:auto}
.code .k{color:var(--accent)} .code .s{color:var(--ok)} .code .n{color:var(--warn)} .code .c{color:var(--ink-3)}
.empty{padding:28px;text-align:center;color:var(--ink-3);font-size:13px}

/* loaders */
.skel{position:relative;overflow:hidden;background:var(--skel-a);border-radius:8px;color:transparent!important}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,var(--skel-b),transparent);animation:shimmer 1.3s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent-line);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.dots{display:inline-flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:bob 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s} .dots i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.stagger > *{animation:rise .5s var(--ease) both}
.stagger > *:nth-child(1){animation-delay:.02s}.stagger > *:nth-child(2){animation-delay:.07s}.stagger > *:nth-child(3){animation-delay:.12s}
.stagger > *:nth-child(4){animation-delay:.17s}.stagger > *:nth-child(5){animation-delay:.22s}.stagger > *:nth-child(6){animation-delay:.27s}
.stagger > *:nth-child(7){animation-delay:.32s}.stagger > *:nth-child(8){animation-delay:.37s}.stagger > *:nth-child(n+9){animation-delay:.42s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pop{animation:pop .45s var(--ease) both}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.flash{animation:flash 1.2s var(--ease)}
@keyframes flash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}100%{box-shadow:0 0 0 12px transparent}}

/* ---------- desk agent (chat) ---------- */
.chat{width:380px;border-left:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;min-height:0;transition:width .45s var(--ease-io)}
.chat.closed{width:0;overflow:hidden;border-left:0}
.chat-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);min-width:380px}
.chat-h .orb{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--violet));display:grid;place-items:center;color:#fff;flex:none}
.chat-h b{font-size:14px} .chat-h small{display:block;color:var(--ink-3);font-size:11.5px}
.chat-log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:380px;scroll-behavior:smooth}
.msg{max-width:92%;animation:rise .35s var(--ease) both}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;padding:9px 12px;border-radius:14px 14px 4px 14px;font-size:13.5px}
.msg.me .via{display:block;font-size:10.5px;opacity:.75;margin-top:3px}
.msg.bot{align-self:flex-start;display:grid;gap:8px;font-size:13.5px}
.msg.bot .bubble{background:var(--sunk);border:1px solid var(--line);padding:10px 12px;border-radius:14px 14px 14px 4px}
/* App mode (default) hides what exists for the demo video; ?showcase or #tour shows it. */
:root:not(.showcase) .demo-only,:root:not(.showcase) #catalogue-similar{display:none !important}
:root:not(.showcase) .toolcall .ms{display:none}
.toolcall{display:flex;align-items:center;gap:8px;font:11.5px var(--f-mono);color:var(--ink-2);background:var(--card);border:1px dashed var(--line-2);border-radius:9px;padding:6px 9px;flex-wrap:wrap}
.toolcall .fn{color:var(--accent);font-weight:500}
.toolcall .ms{margin-left:auto;color:var(--ink-3)}
.toolcall .fn{font-family:var(--f-body);font-weight:600}
.toolcall .arg{font-family:var(--f-body);background:var(--sunk);border-radius:6px;padding:1px 7px;color:var(--ink)}
.tstrip{position:relative;height:30px;margin:8px 2px 2px;border-radius:8px;background:var(--sunk);overflow:hidden}
.tstrip i{position:absolute;top:6px;height:18px;border-radius:4px;background:var(--accent);opacity:.85;min-width:3px;animation:pop .4s var(--ease) both}
.tstrip i.possible{background:var(--violet,#7C5CFF);opacity:.7}.tstrip i.weak{background:var(--ink-3);opacity:.5}.tstrip i.subj{background:var(--ok)}
.tstrip .w{position:absolute;top:0;bottom:0;background:var(--accent-soft);border-left:1.5px solid var(--accent);border-right:1.5px solid var(--accent)}
.tstrip-ax{display:flex;justify-content:space-between;font:10.5px var(--f-mono);color:var(--ink-3);margin:2px 2px 0}
.nchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.nchips .chip{font-size:12px}.nchips .chip b{font-weight:600;color:var(--accent);margin-left:4px}
.nchips .chip[data-best]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.seen{display:grid;gap:6px;margin-top:6px}
.seen .r{display:grid;grid-template-columns:30px 1fr auto;gap:9px;align-items:center;font-size:12px;padding:5px 6px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.seen img{width:30px;height:40px;object-fit:cover;border-radius:5px}
.seen .mono{font-size:11px;color:var(--ink-3)}
.cbars{display:grid;gap:7px;margin-top:6px}
.cbars .r{display:grid;grid-template-columns:110px 1fr 26px;gap:8px;align-items:center;font-size:12px}
.cbars .r .prog{height:7px}
.msg.me img.ref{display:block;width:96px;height:120px;object-fit:cover;border-radius:9px;margin-bottom:6px}
.steps{display:grid;gap:5px;font-size:12.5px;color:var(--ink-2)}
.steps div{display:flex;align-items:center;gap:8px;animation:rise .3s var(--ease) both}
.steps .ck{width:16px;height:16px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;flex:none}
.cand-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cand{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);text-align:left;padding:0;transition:border-color .2s,transform .2s}
.cand:hover{border-color:var(--accent);transform:translateY(-2px)}
.cand img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--sunk)}
.cand div{padding:6px 7px;font-size:11px;line-height:1.3}
.cand b{display:block;font-size:11.5px}
.chat-sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px;min-width:380px}
.chat-in{border-top:1px solid var(--line);padding:12px 16px 14px;min-width:380px;display:grid;gap:8px}
.chat-in .box{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line-2);border-radius:14px;padding:8px 8px 8px 12px;background:var(--card);transition:border-color .2s,box-shadow .2s}
.chat-in .box:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.chat-in textarea{flex:1;border:0;outline:0;resize:none;background:transparent;font-size:13.5px;max-height:120px;padding:5px 0}
.mic{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);display:grid;place-items:center;color:var(--ink-2);position:relative;flex:none}
.mic.on{background:var(--bad);border-color:var(--bad);color:#fff}
.mic.on::after{content:"";position:absolute;inset:-5px;border-radius:13px;border:2px solid var(--bad);animation:ring 1.2s infinite}
